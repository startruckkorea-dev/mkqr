function showLoginErr(msg) {
  const el = document.getElementById("login-err");
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

async function getGraphToken() {
  const account = msalApp.getActiveAccount();
  const tokenRes = await msalApp.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
  return tokenRes.accessToken;
}

async function apiGet(path, token) {
  const res = await fetch(GRAPH + path, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error(path + " → " + res.status);
  return res.json();
}

async function getMkListId(listName) {
  if (_mkListIds[listName]) return _mkListIds[listName];
  const token = await getGraphToken();
  const res = await apiGet(`/sites/${_siteId}/lists?$filter=displayName eq '${listName}'`, token);

// apiAll() 패턴과 동일 — 5,000건 임계값 대비 nextLink를 따라 무제한 순회
async function mkListAll(listName, extraQuery = "") {
  const token = await getGraphToken();
  const listId = await getMkListId(listName);
  let items = [];
  let url = `${GRAPH}/sites/${_siteId}/lists/${listId}/items?expand=fields&$top=200${extraQuery}`;
  while (url) {
    const res = await fetch(url, { headers: { Authorization: "Bearer " + token, Prefer: "HonorNonIndexedQueriesWarningMayFailRandomly" } });
    if (!res.ok) throw new Error(`${listName} 조회 실패 (${res.status})`);
    const data = await res.json();
    items = items.concat(data.value || []);
    url = data["@odata.nextLink"] || null;
  }
  return items;
}

// UTC → KST(+9h) 변환, 다른 APS 시스템들과 동일한 공통 규칙
function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const kst = new Date(d.getTime() + 9 * 3600 * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${kst.getUTCFullYear()}-${p(kst.getUTCMonth() + 1)}-${p(kst.getUTCDate())} ${p(kst.getUTCHours())}:${p(kst.getUTCMinutes())}`;
}

const ICON_MAX_BYTES = 50 * 1024; // 50KB
const ICON_ALLOWED_EXT = ["jpg", "jpeg", "png", "gif", "webp"];

// 업체 아이콘을 MKQR_Media_AttachedFiles/{YYYY-MM-DD}/ 아래에 날짜별로 쌓이게 업로드.
async function uploadCenterIcon(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (!ICON_ALLOWED_EXT.includes(ext)) {
    throw new Error(`이미지 파일만 업로드할 수 있습니다 (${ICON_ALLOWED_EXT.join("/")}).`);
  }
  if (file.size > ICON_MAX_BYTES) {
    throw new Error(`파일 크기는 50KB 이하만 가능합니다. (현재 ${Math.round(file.size / 1024)}KB)`);
  }
  const token = await getGraphToken();
  const driveId = await getMkAttachedFilesDriveId();
  const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  const safeName = `${Date.now()}_${file.name.replace(/[^\w.\-가-힣]/g, "_")}`;
  const path = `MKQR_Media_AttachedFiles/${today}/${encodeURIComponent(safeName)}`;
  const buf = await file.arrayBuffer();
  const res = await fetch(`${GRAPH}/drives/${driveId}/root:/${path}:/content`, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token, "Content-Type": file.type || "application/octet-stream" },
    body: buf,
  });
  if (!res.ok) throw new Error(`아이콘 업로드 실패 (${res.status})`);
  return res.json(); // { id, webUrl, name, ... }
}

// driveItem id로 실제 표시 가능한(임시, 약 1시간 유효) 다운로드 링크를 다시 조회.

// system_config_final.xlsx(다른 모든 APS 시스템이 공용으로 쓰는 설정 파일)에서 이름/이메일이 적힌 모든 행을
// 시스템 구분 없이 긁어모아 "직원 검색용 디렉토리"로 만든다. 관리자 등록 시 이메일을 직접 타이핑하지 않고
// 이름/이메일로 검색해서 고를 수 있게 하기 위함. 조회 전용이라 이 파일에 아무것도 쓰지 않는다.
let _mkEmployeeDirectory = null;
// employee_search.xlsx (Company/Department/Team/EngName/EMail/WMC 컬럼) — APS/GW 등 거의 모든 STK 시스템이
// 계정 정보를 읽어올 때 쓰는 공용 전사 직원 명부. system_config_final.xlsx보다 훨씬 포괄적이라 이걸 기본으로 쓴다.
async function loadEmployeeDirectory() {
  if (_mkEmployeeDirectory) return _mkEmployeeDirectory;
  const token = await getGraphToken();
  const docDriveId = await getMkDocDriveId(token);
  const res = await fetch(`${GRAPH}/drives/${docDriveId}/root:/employee_search.xlsx:/content`, {
    headers: { Authorization: "Bearer " + token }, cache: "no-cache",
  });
  if (!res.ok) throw new Error(`employee_search.xlsx 조회 실패 (${res.status})`);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
  const header = (rows[0] || []).map((h) => String(h || "").trim().toLowerCase());
  const nameIdx = header.indexOf("engname");
  const emailIdx = header.indexOf("email");
  const deptIdx = header.indexOf("department");
  if (emailIdx < 0) throw new Error("employee_search.xlsx에 EMail 컬럼을 찾을 수 없습니다.");
  const byEmail = new Map();
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const email = String(row[emailIdx] || "").trim().toLowerCase();
    if (!email || !email.includes("@")) continue;
    const name = nameIdx >= 0 ? String(row[nameIdx] || "").trim() : "";
    const dept = deptIdx >= 0 ? String(row[deptIdx] || "").trim() : "";
    if (!byEmail.has(email)) byEmail.set(email, { name: name || email, email, dept });
  }
  _mkEmployeeDirectory = Array.from(byEmail.values()).sort((a, b) => a.name.localeCompare(b.name));
  return _mkEmployeeDirectory;
}

function randomToken(len = 10) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

// User-Agent 문자열을 "iPhone · Safari" 같은 짧은 기기 설명으로 변환 — 체크인 기록에서 어떤 장비로
// 접근했는지 한눈에 보기 위함. 완벽한 기기 판별은 아니고 대략적인 OS/브라우저 구분용.
// 지역명 문자열을 기준으로 일관된 배지 색상을 골라준다 (같은 지역은 항상 같은 색)
const REGION_COLORS = [
  "bg-blue-100 text-blue-700", "bg-purple-100 text-purple-700", "bg-rose-100 text-rose-700",
  "bg-amber-100 text-amber-700", "bg-teal-100 text-teal-700", "bg-indigo-100 text-indigo-700",
  "bg-orange-100 text-orange-700", "bg-cyan-100 text-cyan-700",
];
function regionBadgeColor(region) {
  if (!region) return "bg-slate-100 text-slate-600";
  let hash = 0;
  for (let i = 0; i < region.length; i++) hash = (hash * 31 + region.charCodeAt(i)) >>> 0;
  return REGION_COLORS[hash % REGION_COLORS.length];
}

function parseDeviceLabel(ua) {
  if (!ua) return "-";
  let os = "기타 OS";
  if (/iPhone/i.test(ua)) os = "iPhone";
  else if (/iPad/i.test(ua)) os = "iPad";
  else if (/Android/i.test(ua)) {
    const m = ua.match(/Android[^;)]*;\s*([^;)]+)/i);
    os = m && m[1] ? `Android(${m[1].trim().slice(0, 18)})` : "Android";
  } else if (/Macintosh/i.test(ua)) os = "Mac";
  else if (/Windows/i.test(ua)) os = "Windows";
  else if (/Linux/i.test(ua)) os = "Linux";

  let browser = "기타 브라우저";
  let verMatch = null;
  if (/EdgA|Edg\//i.test(ua)) { browser = "Edge"; verMatch = ua.match(/Edg[A]?\/([\d.]+)/i); }
  else if (/KAKAOTALK/i.test(ua)) browser = "카카오톡 인앱";
  else if (/NAVER/i.test(ua)) browser = "네이버 인앱";
  else if (/SamsungBrowser/i.test(ua)) { browser = "Samsung Internet"; verMatch = ua.match(/SamsungBrowser\/([\d.]+)/i); }
  else if (/FxiOS|Firefox/i.test(ua)) { browser = "Firefox"; verMatch = ua.match(/(?:FxiOS|Firefox)\/([\d.]+)/i); }
  else if (/CriOS|Chrome/i.test(ua)) { browser = "Chrome"; verMatch = ua.match(/(?:CriOS|Chrome)\/([\d.]+)/i); }
  else if (/Safari/i.test(ua)) { browser = "Safari"; verMatch = ua.match(/Version\/([\d.]+)/i); }
  if (verMatch && verMatch[1]) browser += ` ${verMatch[1].split(".")[0]}`;

  return `${os} · ${browser}`;
}

// Haversine 거리(km) — 관리자 화면에서 좌표 확인용. 실제 체크인 판정은 Worker가 서버측에서 동일 공식으로 계산.
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

const MAX_CENTERS = 40; // QR은 센터당 1개씩 발급되므로 곧 QR 최대 개수와 동일

function CentersTab({ centers, reload, onCreated }) {
  const [editing, setEditing] = useState(null); // null | {} (신규) | {...} (수정)
  const [busy, setBusy] = useState(false);
  const [q, setQ] = useState("");
  const [iconUrls, setIconUrls] = useState({}); // centerId -> 임시 다운로드 URL
  const fileRef = useRef(null);

  const filtered = centers.filter((c) => !q || c.Title?.includes(q) || c.Region?.includes(q) || c.AddressKr?.includes(q));

  useEffect(() => {
    const withIcon = centers.filter((c) => c.IconDriveItemId && !iconUrls[c.id]);
    if (!withIcon.length) return;
    Promise.all(withIcon.map((c) => getMkIconDownloadUrl(c.IconDriveItemId).then((url) => [c.id, url]).catch(() => [c.id, null])))
      .then((pairs) => {
        setIconUrls((prev) => {
          const next = { ...prev };
          pairs.forEach(([id, url]) => { if (url) next[id] = url; });
          return next;
        });
      });
  }, [centers]);

  async function save(form) {
    if (!editing?.id && centers.length >= MAX_CENTERS) {
      alert(`QR 코드(=센터)는 최대 ${MAX_CENTERS}개까지만 만들 수 있습니다.\n현재 ${centers.length}개가 등록되어 있어 더 이상 추가할 수 없습니다.`);
      return;
    }
    setBusy(true);
    try {
      const fields = {
        Title: form.Title, Region: form.Region, CenterNameEn: form.CenterNameEn,
        CorpNameKr: form.CorpNameKr, AddressKr: form.AddressKr, AddressEn: form.AddressEn,
        Phone: form.Phone, Lat: form.Lat ? Number(form.Lat) : null, Lng: form.Lng ? Number(form.Lng) : null,
        RedirectUrl: form.RedirectUrl || "",
        VerifyRadiusM: form.VerifyRadiusM ? Number(form.VerifyRadiusM) : 10000,
        Active: form.Active !== false,
      };
      if (form._iconFile) {
        const uploaded = await uploadCenterIcon(form._iconFile);
        fields.IconDriveItemId = uploaded.id;
      }
      if (editing?.id) {
        await mkUpdateItem(MK_LISTS.centers, editing.id, fields);
        setEditing(null);
        await reload();
      } else {
        fields.QrToken = randomToken();
        const created = await mkCreateItem(MK_LISTS.centers, fields);
        setEditing(null);
        await reload();
        if (onCreated) onCreated(created.id);
      }
    } catch (e) { alert(e.message); } finally { setBusy(false); }
  }

  async function remove(c) {
    if (!confirm(`"${c.Title}" 센터를 삭제할까요? (관련 QR도 더 이상 사용할 수 없게 됩니다)`)) return;
    try { await mkDeleteItem(MK_LISTS.centers, c.id); await reload(); } catch (e) { alert(e.message); }
  }

  async function geocode(form, setForm) {
    const addr = form.AddressKr;
    if (!addr) { alert("주소를 먼저 입력하세요"); return; }
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q=${encodeURIComponent(addr)}`);
      const data = await res.json();
      if (!data.length) { alert("좌표를 찾지 못했습니다. 직접 입력해주세요."); return; }
      setForm((f) => ({ ...f, Lat: data[0].lat, Lng: data[0].lon }));
    } catch (e) { alert("좌표 조회 실패: " + e.message); }
  }

  // mkqr 전용 가져오기 양식 다운로드 — "템플릿 다운로드" 버튼에서 사용
  function downloadTemplate() {
    const header = ["지역", "센터명(필수)", "센터명(영문)", "법인명", "주소(필수)", "주소(영문)", "전화번호", "GPS허용반경(m)"];
    const example = ["Seoul/Gyeonggi", "곤지암센터", "Gonjiam Center", "㈜스타트럭코리아", "경기도 광주시 곤지암읍 평촌길 100-9", "", "031-000-0000", "10000"];
    const ws = XLSX.utils.aoa_to_sheet([header, example]);
    ws["!cols"] = [{ wch: 16 }, { wch: 16 }, { wch: 18 }, { wch: 20 }, { wch: 36 }, { wch: 24 }, { wch: 16 }, { wch: 16 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "센터목록");
    XLSX.writeFile(wb, "MKQR_센터등록_양식.xlsx");
  }

  // 엑셀 일괄 가져오기 — 위 템플릿(1행 헤더: 지역/센터명/센터명영문/법인명/주소/주소영문/전화번호)을 그대로 파싱
  async function importExcel(file) {
    if (centers.length >= MAX_CENTERS) {
      alert(`QR 코드(=센터)는 최대 ${MAX_CENTERS}개까지만 만들 수 있습니다.\n현재 ${centers.length}개가 등록되어 있어 더 이상 추가할 수 없습니다.`);
      if (fileRef.current) fileRef.current.value = "";
      return;
    }
    setBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]]; // 첫 번째 시트 사용 (시트명 무관)
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      const existingTitles = new Set(centers.map((c) => c.Title));
      const existingRegions = new Set(centers.map((c) => c.Region).filter(Boolean));
      let created = 0, skipped = 0, blockedByLimit = 0;
      let totalCount = centers.length; // 등록될 때마다 증가시키며 40개 한도 체크
      const regionNotices = []; // 센터명은 새것이지만 지역은 기존에 이미 있는 경우 (참고용, 등록은 진행)
      for (let r = 1; r < rows.length; r++) { // 0행은 헤더이므로 1행부터
        const row = rows[r] || [];
        const nameKr = row[1] ? String(row[1]).trim() : "";
        if (!nameKr) continue; // 센터명 없는 빈 줄은 스킵
        const region = row[0] ? String(row[0]).trim() : "";
        const fields = {
          Title: nameKr,
          Region: region,
          CenterNameEn: row[2] ? String(row[2]).trim() : "",
          CorpNameKr: row[3] ? String(row[3]).trim() : "",
          AddressKr: row[4] ? String(row[4]).trim() : "",
          AddressEn: row[5] ? String(row[5]).trim() : "",
          Phone: row[6] ? String(row[6]).trim() : "",
          QrToken: randomToken(),
          VerifyRadiusM: row[7] ? Number(row[7]) : 10000,
          Active: true,
        };
        if (existingTitles.has(fields.Title)) { skipped++; continue; } // 센터명 중복 → 진짜 중복이니 건너뜀
        if (totalCount >= MAX_CENTERS) { blockedByLimit++; continue; } // 40개 한도 초과분은 등록 안 함
        if (region && existingRegions.has(region)) { regionNotices.push(fields.Title); } // 지역만 중복 → 등록은 진행, 안내만
        await mkCreateItem(MK_LISTS.centers, fields);
        existingTitles.add(fields.Title); // 같은 파일 안에서도 중복 방지
        if (region) existingRegions.add(region);
        totalCount++;
        created++;
      }
      let msg = `${created}개 센터를 가져왔습니다.`;
      if (blockedByLimit) msg += `\nQR 최대 ${MAX_CENTERS}개 제한으로 ${blockedByLimit}건은 등록되지 않았습니다. (기존 센터를 정리하시거나 관리자에게 문의해주세요)`;
      if (skipped) msg += `\n센터명 중복 ${skipped}건은 건너뜀.`;
      if (regionNotices.length) msg += `\n\n※ 같은 지역에 이미 다른 센터가 있는 신규 등록건 (참고용, 정상 등록됨):\n${regionNotices.join(", ")}`;
      msg += `\n\n주소만 채워졌으니 각 센터에서 "좌표 찾기"로 위경도를 채워주세요.`;
      alert(msg);
      await reload();
    } catch (e) { alert("가져오기 실패: " + e.message); } finally { setBusy(false); if (fileRef.current) fileRef.current.value = ""; }
  }

  const activeCount = centers.filter((c) => c.Active !== false).length;
  const inactiveCenters = centers.filter((c) => c.Active === false);
  const missingCoordCenters = centers.filter((c) => !(c.Lat && c.Lng));
  const [statModal, setStatModal] = useState(null); // { title, items: [{Title, sub}] } | null

  return (
    <div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div onClick={() => setStatModal({ title: "전체 센터", items: centers.map((c) => ({ Title: c.Title, sub: c.Region })) })}
          className="bg-white rounded-xl border p-4 flex items-center gap-3 cursor-pointer hover:border-slate-300 hover:shadow-sm transition-all">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ background: BRAND.accentSoft }}>
            <Building2 size={17} style={{ color: BRAND.accent }} />
          </div>
          <div>
            <div className="text-xl font-semibold text-slate-800">{centers.length}<span className="text-sm font-normal text-slate-400"> / {MAX_CENTERS}</span></div>
            <div className="text-xs text-slate-400">전체 센터 (QR 최대 {MAX_CENTERS}개)</div>
          </div>
        </div>
        <div onClick={() => setStatModal({ title: "활성 센터", items: centers.filter((c) => c.Active !== false).map((c) => ({ Title: c.Title, sub: c.Region })) })}
          className="bg-white rounded-xl border p-4 flex items-center gap-3 cursor-pointer hover:border-slate-300 hover:shadow-sm transition-all">
          <div className="w-9 h-9 rounded-lg bg-emerald-50 flex items-center justify-center shrink-0">
            <CheckCircle2 size={17} className="text-emerald-600" />
          </div>
          <div>
            <div className="text-xl font-semibold text-slate-800">{activeCount}</div>
            <div className="text-xs text-slate-400">활성 (QR 사용 가능)</div>
          </div>
        </div>
        <div onClick={() => setStatModal({ title: "비활성 센터", items: inactiveCenters.map((c) => ({ Title: c.Title, sub: c.Region })) })}
          className="bg-white rounded-xl border p-4 flex items-center gap-3 cursor-pointer hover:border-slate-300 hover:shadow-sm transition-all">
          <div className="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center shrink-0">
            <XCircle size={17} className="text-slate-400" />
          </div>
          <div>
            <div className="text-xl font-semibold text-slate-800">{inactiveCenters.length}</div>
            <div className="text-xs text-slate-400">비활성</div>
          </div>
        </div>
        <div onClick={() => setStatModal({ title: "좌표 미설정 센터", items: missingCoordCenters.map((c) => ({ Title: c.Title, sub: c.AddressKr || "주소 미입력" })) })}
          className="bg-white rounded-xl border p-4 flex items-center gap-3 cursor-pointer hover:border-slate-300 hover:shadow-sm transition-all">
          <div className="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center shrink-0">
            <MapPin size={17} className="text-amber-600" />
          </div>
          <div>
            <div className="text-xl font-semibold text-slate-800">{missingCoordCenters.length}</div>
            <div className="text-xs text-slate-400">좌표 미설정</div>
          </div>
        </div>
      </div>

      {statModal && (
        <Modal title={statModal.title} onClose={() => setStatModal(null)}>
          {statModal.items.length ? (
            <div className="space-y-1 max-h-80 overflow-y-auto">
              {statModal.items.map((it, i) => (
                <div key={i} className="flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-50 text-sm">
                  <span className="font-medium text-slate-700">{it.Title}</span>
                  <span className="text-xs text-slate-400">{it.sub}</span>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-center text-slate-400 text-sm py-6">해당하는 센터가 없습니다</div>
          )}
        </Modal>
      )}

      <div className="flex items-center justify-between mb-4 gap-2 flex-wrap">
        <div className="relative">
          <Search size={15} className="absolute left-2.5 top-2.5 text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="센터명/지역/주소 검색" className="pl-8 pr-3 py-2 border border-slate-300 rounded-lg text-sm w-64" />
        </div>
        <div className="flex gap-2">
          <button onClick={downloadTemplate} className="flex items-center gap-1.5 px-3 py-2 border border-slate-300 rounded-lg text-sm hover:bg-slate-50">
            <Download size={15} /> 템플릿 다운로드
          </button>
          <input ref={fileRef} type="file" accept=".xlsx" className="hidden" onChange={(e) => e.target.files[0] && importExcel(e.target.files[0])} />
          <button onClick={() => fileRef.current.click()} disabled={busy} className="flex items-center gap-1.5 px-3 py-2 border border-slate-300 rounded-lg text-sm hover:bg-slate-50">
            <Upload size={15} /> 엑셀 일괄 등록하기
          </button>
          <button
            onClick={() => centers.length >= MAX_CENTERS
              ? alert(`QR 코드(=센터)는 최대 ${MAX_CENTERS}개까지만 만들 수 있습니다.\n현재 ${centers.length}개가 등록되어 있어 더 이상 추가할 수 없습니다.`)
              : setEditing({})}
            className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm text-white ${centers.length >= MAX_CENTERS ? "opacity-50 cursor-not-allowed" : ""}`}
            style={{ background: BRAND.accent }}>
            <Plus size={15} /> 센터 추가
          </button>
        </div>
      </div>

      {filtered.length > 0 && (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          {filtered.map((c) => {
            const initial = (c.Title || "?").trim().charAt(0);
            const regionColor = regionBadgeColor(c.Region);
            return (
              <div key={c.id} onClick={() => setEditing(c)}
                className="bg-white rounded-xl border p-4 hover:shadow-md hover:border-slate-300 transition-all cursor-pointer relative group">
                <div className="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity" onClick={(e) => e.stopPropagation()}>
                  <button onClick={() => setEditing(c)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100"><Pencil size={14} /></button>
                  <button onClick={() => remove(c)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50"><Trash2 size={14} /></button>
                </div>

                <div className="flex items-start gap-3 mb-3">
                  {iconUrls[c.id]
                    ? <img src={iconUrls[c.id]} alt={c.Title} className="w-11 h-11 rounded-xl object-cover shrink-0 border" />
                    : (
                      <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 text-white font-semibold text-lg" style={{ background: BRAND.navy }}>
                        {initial}
                      </div>
                    )}
                  <div className="min-w-0 pr-12">
                    <div className="font-semibold text-slate-800 truncate">{c.Title}</div>
                    <div className="text-xs text-slate-400 truncate">{c.CorpNameKr || c.CenterNameEn || "\u00A0"}</div>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 mb-3">
                  {c.Region && (
                    <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium ${regionColor}`}>{c.Region}</span>
                  )}
                  {c.Active === false
                    ? <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">비활성</span>
                    : <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-medium">활성</span>}
                </div>

                <div className="space-y-1.5 text-xs text-slate-500">
                  <div className="flex items-start gap-1.5">
                    <MapPin size={13} className="shrink-0 mt-0.5 text-slate-300" />
                    <span className="truncate">{c.AddressKr || "주소 미입력"}</span>
                  </div>
                  {c.Phone && (
                    <div className="flex items-center gap-1.5">
                      <Phone size={13} className="shrink-0 text-slate-300" />
                      <span>{c.Phone}</span>
                    </div>
                  )}
                  <div className="flex items-center gap-1.5">
                    <Navigation size={13} className="shrink-0 text-slate-300" />
                    {c.Lat && c.Lng
                      ? <span>{Number(c.Lat).toFixed(4)}, {Number(c.Lng).toFixed(4)} · 허용반경 {((c.VerifyRadiusM ?? 10000) / 1000).toFixed(1)}km</span>
                      : <span className="text-amber-600">좌표 미설정</span>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {!filtered.length && (
        <div className="bg-white rounded-xl border py-16 text-center">
          <Building2 size={28} className="mx-auto text-slate-300 mb-2" />
          <div className="text-slate-500 text-sm mb-1">{centers.length ? "검색 결과가 없습니다" : "등록된 센터가 없습니다"}</div>
          {!centers.length && (
            <div className="text-slate-400 text-xs">우측 상단 "센터 추가" 또는 "엑셀 일괄 등록하기"로 시작해보세요</div>
          )}
        </div>
      )}

      {editing !== null && <CenterEditModal center={editing} onClose={() => setEditing(null)} onSave={save} onGeocode={geocode} busy={busy} />}
    </div>
  );
}

function CenterEditModal({ center, onClose, onSave, onGeocode, busy }) {
  const [form, setForm] = useState({ Active: true, ...center });
  const [iconPreview, setIconPreview] = useState(null);
  const [existingIconUrl, setExistingIconUrl] = useState(null);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  useEffect(() => {
    let cancelled = false;
    if (center.IconDriveItemId) {
      getMkIconDownloadUrl(center.IconDriveItemId).then((url) => { if (!cancelled) setExistingIconUrl(url); }).catch(() => {});
    }
    return () => { cancelled = true; };
  }, [center.IconDriveItemId]);

  function onPickIcon(e) {
    const file = e.target.files[0];
    if (!file) return;
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (!ICON_ALLOWED_EXT.includes(ext)) {
      alert(`이미지 파일만 가능합니다 (${ICON_ALLOWED_EXT.join("/")}).`);
      e.target.value = "";
      return;
    }
    if (file.size > ICON_MAX_BYTES) {
      alert(`파일 크기는 50KB 이하만 가능합니다. (현재 ${Math.round(file.size / 1024)}KB)`);
      e.target.value = "";
      return;
    }
    setForm((f) => ({ ...f, _iconFile: file }));
    setIconPreview(URL.createObjectURL(file));
  }

  const displayIcon = iconPreview || existingIconUrl;

  return (
    <Modal title={center.id ? "센터 수정" : "센터 추가"} onClose={onClose}>
      <Field label="업체 아이콘 (선택)">
        <div className="flex items-center gap-3">
          {displayIcon
            ? <img src={displayIcon} alt="아이콘" className="w-14 h-14 rounded-xl object-cover border" />
            : <div className="w-14 h-14 rounded-xl bg-slate-100 flex items-center justify-center text-slate-300"><ImagePlus size={20} /></div>}
          <label className="flex items-center gap-1.5 px-3 py-2 border border-slate-300 rounded-lg text-sm hover:bg-slate-50 cursor-pointer">
            <Upload size={14} /> 이미지 선택
            <input type="file" accept=".jpg,.jpeg,.png,.gif,.webp" className="hidden" onChange={onPickIcon} />
          </label>
        </div>
        <p className="text-xs text-slate-400 mt-1.5">JPG/PNG/GIF/WEBP 이미지 파일만 가능하며, 용량은 50KB 이하여야 합니다.</p>
      </Field>
      <Field label="센터명 (국문, 필수)"><input className={inputCls} value={form.Title || ""} onChange={set("Title")} placeholder="예: 곤지암센터" /></Field>
      <Field label="지역"><input className={inputCls} value={form.Region || ""} onChange={set("Region")} placeholder="예: Seoul/Gyeonggi" /></Field>
      <Field label="센터명 (영문)"><input className={inputCls} value={form.CenterNameEn || ""} onChange={set("CenterNameEn")} /></Field>
      <Field label="법인명"><input className={inputCls} value={form.CorpNameKr || ""} onChange={set("CorpNameKr")} /></Field>
      <Field label="주소">
        <div className="flex gap-2">
          <input className={inputCls} value={form.AddressKr || ""} onChange={set("AddressKr")} placeholder="예: 경기도 광주시 곤지암읍 평촌길 100-9" />
          <button type="button" onClick={() => onGeocode(form, setForm)} className="shrink-0 px-3 rounded-lg border border-slate-300 text-sm hover:bg-slate-50 flex items-center gap-1">
            <MapPin size={14} /> 좌표 찾기
          </button>
        </div>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="위도 (Lat)"><input className={inputCls} value={form.Lat || ""} onChange={set("Lat")} /></Field>
        <Field label="경도 (Lng)"><input className={inputCls} value={form.Lng || ""} onChange={set("Lng")} /></Field>
      </div>
      <Field label="GPS 허용 반경 (m)">
        <input
          type="text"
          inputMode="numeric"
          className={inputCls}
          value={(() => {
            if (form.VerifyRadiusM === "") return "";
            const base = form.VerifyRadiusM != null ? form.VerifyRadiusM : 10000;
            const digits = String(base).replace(/[^\d]/g, "");
            return digits ? Number(digits).toLocaleString("ko-KR") : "";
          })()}
          onChange={(e) => {
            const digits = e.target.value.replace(/[^\d]/g, "");
            setForm((f) => ({ ...f, VerifyRadiusM: digits }));
          }}
          placeholder="예: 10,000 (=10km)"
        />
        <p className="text-xs text-slate-400 mt-1">이 반경 안에서 체크인하면 "정상", 벗어나면 "검증필요"로 분류됩니다. 기본값 10,000m(10km).</p>
      </Field>
      <Field label="대표 전화번호"><input className={inputCls} value={form.Phone || ""} onChange={set("Phone")} /></Field>
      <Field label="체크인 완료 후 이동시킬 링크 (선택)">
        <input className={inputCls} value={form.RedirectUrl || ""} onChange={set("RedirectUrl")} placeholder="예: https://www.startruckkorea.com (비워두면 완료 화면만 표시)" />
      </Field>
      <Field label="상태">
        <select className={inputCls} value={form.Active === false ? "false" : "true"} onChange={(e) => setForm((f) => ({ ...f, Active: e.target.value === "true" }))}>
          <option value="true">활성 (QR 사용 가능)</option>
          <option value="false">비활성 (QR 비활성화)</option>
        </select>
      </Field>
      <div className="flex justify-end gap-2 mt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg border border-slate-300">취소</button>
        <button disabled={busy || !form.Title} onClick={() => onSave(form)} className="px-4 py-2 text-sm rounded-lg text-white disabled:opacity-50" style={{ background: BRAND.accent }}>
          {busy ? "저장 중..." : "저장"}
        </button>
      </div>
    </Modal>
  );
}

function QrTab({ centers, highlightId }) {
  const canvasRefs = useRef({});
  const cardRefs = useRef({});
  const [checkinBaseUrl, setCheckinBaseUrl] = useState(() => {
    // 기본값: 같은 저장소의 checkin.html (배포 후 실제 도메인으로 자동 대응)
    return window.location.origin + window.location.pathname.replace(/index\.html$/, "").replace(/\/$/, "") + "/checkin.html";
  });

  useEffect(() => {
    centers.forEach((c) => {
      const el = canvasRefs.current[c.id];
      if (!el || !c.QrToken) return;
      const url = `${checkinBaseUrl}?t=${c.QrToken}`;
      QRCode.toCanvas(el, url, { width: 180, margin: 1, color: { dark: BRAND.navy, light: "#ffffff" } });
    });
  }, [centers, checkinBaseUrl]);

  useEffect(() => {
    if (highlightId && cardRefs.current[highlightId]) {
      cardRefs.current[highlightId].scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }, [highlightId, centers]);

  function download(centerId, title) {
    const el = canvasRefs.current[centerId];
    if (!el) return;
    const link = document.createElement("a");
    link.download = `MKQR_${title}.png`;
    link.href = el.toDataURL("image/png");
    link.click();
  }

  return (
    <div>
      <Field label="체크인 페이지 기본 주소 (checkin.html 배포 URL)">
        <input className={inputCls} value={checkinBaseUrl} onChange={(e) => setCheckinBaseUrl(e.target.value)} />
      </Field>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
        {centers.filter((c) => c.Active !== false).map((c) => (
          <div key={c.id} ref={(el) => (cardRefs.current[c.id] = el)}
            className={`bg-white border rounded-xl p-4 text-center ${c.id === highlightId ? "ring-2 ring-offset-2" : ""}`}
            style={c.id === highlightId ? { borderColor: BRAND.accent, boxShadow: `0 0 0 2px ${BRAND.accent}` } : {}}>
            {c.id === highlightId && <div className="text-[10px] font-semibold mb-1" style={{ color: BRAND.accent }}>방금 등록됨</div>}
            <div className="font-medium text-sm text-slate-800 mb-2">{c.Title}</div>
            <canvas ref={(el) => (canvasRefs.current[c.id] = el)} className="mx-auto" />
            <div className="text-xs text-slate-400 mt-2 break-all">토큰: {c.QrToken}</div>
            <button onClick={() => download(c.id, c.Title)} className="mt-2 w-full flex items-center justify-center gap-1 text-xs px-2 py-1.5 border border-slate-300 rounded-lg hover:bg-slate-50">
              <Download size={13} /> PNG 다운로드
            </button>
            <a href={`${checkinBaseUrl}?t=${c.QrToken}`} target="_blank" className="mt-1.5 w-full flex items-center justify-center gap-1 text-xs px-2 py-1.5 text-slate-500 hover:text-slate-700">
              <ExternalLink size={12} /> 링크 열기
            </a>
          </div>
        ))}
        {!centers.length && <div className="col-span-4 text-center text-slate-400 py-10">먼저 "센터 관리"에서 센터를 등록해주세요</div>}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 체크인 기록 탭                                                       */
/* ------------------------------------------------------------------ */
function CheckInsTab({ checkins, centers, reload, periodDays, onPeriodChange }) {
  const [filter, setFilter] = useState("전체");
  const [q, setQ] = useState("");
  const [page, setPage] = useState(1);
  const [detail, setDetail] = useState(null); // 상세보기 모달에 띄울 행
  const PAGE_SIZE = 20;

  const rows = checkins
    .filter((r) => filter === "전체" ? r.VerifyStatus !== "차단해제" : r.VerifyStatus === filter)
    .filter((r) => !q || r.CenterName?.includes(q))
    .sort((a, b) => new Date(b.ServerTimestamp || 0) - new Date(a.ServerTimestamp || 0));

  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  const pageSafe = Math.min(page, totalPages);
  const pageRows = rows.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);

  useEffect(() => { setPage(1); }, [filter, q, periodDays]);

  async function approve(r) {
    try { await mkUpdateItem(MK_LISTS.checkins, r.id, { VerifyStatus: "관리자승인" }); await reload(); } catch (e) { alert(e.message); }
  }

  // 특정 기기가 1분 5회 초과로 30분 차단된 경우, 관리자가 그 전에 강제로 풀어줄 때 사용.
  // Worker가 체크인마다 이 기기의 마지막 "차단해제" 기록 이후 접근만으로 차단 여부를 다시 계산하므로,
  // 이 마커 하나만 남겨도 즉시 해당 기기의 접근이 재개된다.
  async function unblockDevice(r) {
    if (!r.DeviceFingerprint) { alert("이 기록엔 기기 식별코드가 없습니다."); return; }
    if (!confirm(`"${r.CenterName}" 센터에서 인증코드 ${r.DeviceFingerprint.slice(0, 8).toUpperCase()} 기기의 차단을 즉시 해제할까요?`)) return;
    try {
      await mkCreateItem(MK_LISTS.checkins, {
        Title: `차단해제 ${r.CenterName} ${new Date().toISOString().slice(0, 16).replace("T", " ")}`,
        CenterId: r.CenterId, CenterName: r.CenterName,
        DeviceFingerprint: r.DeviceFingerprint,
        VerifyStatus: "차단해제",
        ServerTimestamp: new Date().toISOString(),
      });
      alert("차단을 해제했습니다.");
      await reload();
    } catch (e) { alert(e.message); }
  }

  function exportExcel() {
    const data = rows.map((r) => ({
      센터: r.CenterName, 시각: fmtDate(r.ServerTimestamp),
      공인IP: r.PublicIP, "IP위치(도시)": r.IpCity, GPS좌표: r.GpsLat ? `${r.GpsLat}, ${r.GpsLng}` : "",
      "거리(km)": r.DistanceKm, 판정: r.VerifyStatus, reCAPTCHA점수: r.RecaptchaScore, 기기요약: parseDeviceLabel(r.UserAgent), 인증코드: (r.DeviceFingerprint || "").slice(0, 8).toUpperCase(), 기기ID: r.DeviceId, UserAgent원본: r.UserAgent,
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "체크인기록");
    XLSX.writeFile(wb, `MKQR_체크인기록_${new Date().toISOString().slice(0, 10)}.xlsx`);
  }

  // "차단해제" 버튼은 매 행마다 다 보여주면 "이 행이 차단됨"처럼 오해하기 쉬워서,
  // 같은 센터+기기 조합당 가장 최근 행(=정렬상 처음 만나는 행)에만 한 번 보여준다.
  const unblockRowIds = new Set();
  {
    const seenKeys = new Set();
    for (const r of rows) {
      if (!r.DeviceFingerprint) continue;
      const key = `${r.CenterId}|${r.DeviceFingerprint}`;
      if (!seenKeys.has(key)) { seenKeys.add(key); unblockRowIds.add(r.id); }
    }
  }

  return (
    <div>
      <div className="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-4 flex gap-3 max-w-3xl">
        <AlertTriangle size={18} className="text-blue-500 shrink-0 mt-0.5" />
        <div className="text-sm text-blue-900 leading-relaxed">
          <span className="font-medium">자동 판정 기준 안내</span>
          <ul className="mt-1 space-y-0.5 text-blue-800/90 text-[13px] list-disc list-inside">
            <li>
              <b>검증필요</b> — 아래 셋 중 하나라도 해당하면 표시됩니다
              <ul className="mt-0.5 ml-5 space-y-0.5 list-[circle] list-inside">
                <li>센터별 허용 반경(기본 10km)을 벗어난 경우</li>
                <li>반경 안이라도 거리 300m 이상 + reCAPTCHA 0.5 이상(사람처럼 행동)인 경우, 한 번 더 확인차 표시</li>
                <li>reCAPTCHA 점수 0.3 미만(봇처럼 행동)인 경우</li>
              </ul>
            </li>
            <li><b>GPS거부</b> — 위치 정보 제공에 동의하지 않은 경우</li>
            <li><b>자동 30분 차단</b> — 같은 기기가 1분 안에 5회 초과 접근하면 그 즉시 접속 자체가 막힙니다 (기록도 안 남음). 급하면 "차단해제" 버튼으로 조기 해제 가능</li>
          </ul>
        </div>
      </div>

      <div className="flex items-center gap-2 mb-4 flex-wrap">
        <div className="flex gap-2 items-center">
          <select value={periodDays} onChange={(e) => onPeriodChange(Number(e.target.value))} className={inputCls + " w-36"} title="조회 기간 (목록이 커질수록 넓은 기간 조회는 느려질 수 있음)">
            <option value={7}>최근 7일</option>
            <option value={30}>최근 30일</option>
            <option value={90}>최근 90일</option>
            <option value={0}>전체</option>
          </select>
          <select value={filter} onChange={(e) => setFilter(e.target.value)} className={inputCls + " w-40"}>
            <option>전체</option><option>정상</option><option>검증필요</option><option>GPS거부</option><option>관리자승인</option><option>차단해제</option>
          </select>
          <div className="relative">
            <Search size={15} className="absolute left-2.5 top-2.5 text-slate-400" />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="센터 검색" className="pl-8 pr-3 py-2 border border-slate-300 rounded-lg text-sm w-56" />
          </div>
        </div>
        <button onClick={reload} className="flex items-center gap-1.5 px-3 py-2 border border-slate-300 rounded-lg text-sm hover:bg-slate-50"><RefreshCw size={14} /> 새로고침</button>
        <button onClick={exportExcel} className="flex items-center gap-1.5 px-3 py-2 border border-slate-300 rounded-lg text-sm hover:bg-slate-50"><Download size={14} /> Excel 내보내기</button>
      </div>
      <div className="bg-white rounded-xl border overflow-hidden overflow-x-auto w-fit max-w-full">
        <table className="text-sm table-fixed">
          <colgroup>
            <col style={{ width: "112px" }} />
            <col style={{ width: "110px" }} />
            <col style={{ width: "130px" }} />
            <col style={{ width: "170px" }} />
            <col style={{ width: "100px" }} />
            <col style={{ width: "110px" }} />
            <col style={{ width: "150px" }} />
            <col style={{ width: "100px" }} />
            <col style={{ width: "110px" }} />
            <col style={{ width: "190px" }} />
          </colgroup>
          <thead className="bg-slate-50 text-slate-500 text-xs whitespace-nowrap">
            <tr>
              <th className="text-left px-4 py-2.5">판정</th>
              <th className="text-left px-4 py-2.5">센터</th>
              <th className="text-left px-4 py-2.5">시각(KST)</th>
              <th className="text-left px-4 py-2.5">공인 IP</th>
              <th className="text-left px-4 py-2.5">GPS 정확도</th>
              <th className="text-left px-4 py-2.5">거리</th>
              <th className="text-left px-4 py-2.5">기기</th>
              <th className="text-left px-4 py-2.5">인증코드</th>
              <th className="text-left px-4 py-2.5">로봇확인</th>
              <th className="text-right pl-3 pr-6 py-2.5">관리</th>
            </tr>
          </thead>
          <tbody>
            {pageRows.map((r) => (
              <tr key={r.id} onClick={() => setDetail(r)} className="border-t hover:bg-slate-50 cursor-pointer">
                <td className="px-4 py-2.5"><Badge status={r.VerifyStatus} /></td>
                <td className="px-4 py-2.5 font-medium text-slate-800 truncate">{r.CenterName}</td>
                <td className="px-4 py-2.5 text-slate-500 truncate">{fmtDate(r.ServerTimestamp)}</td>
                <td className="px-4 py-2.5 text-slate-500 truncate" title={`${r.PublicIP}${r.IpCity ? ` (${r.IpCity})` : ""}`}>{r.PublicIP}{r.IpCity ? ` (${r.IpCity})` : ""}</td>
                <td className="px-4 py-2.5 text-slate-500 truncate">{r.GpsAccuracy ? `±${Math.round(r.GpsAccuracy)}m` : "-"}</td>
                <td className="px-4 py-2.5 text-slate-500 truncate">{r.DistanceKm != null ? `${Number(r.DistanceKm).toFixed(1)}km (${r.DistanceSource})` : "-"}</td>
                <td className="px-4 py-2.5 text-slate-500 truncate" title={r.UserAgent || ""}>{parseDeviceLabel(r.UserAgent)}</td>
                <td className="px-4 py-2.5 text-slate-400 font-mono text-xs truncate" title={r.DeviceFingerprint || ""}>{r.DeviceFingerprint ? r.DeviceFingerprint.slice(0, 8).toUpperCase() : "-"}</td>
                <td className="px-4 py-2.5">
                  {r.RecaptchaScore == null
                    ? <span className="text-xs text-slate-400">미확인</span>
                    : r.RecaptchaScore >= 0.5
                      ? <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">정상 ({r.RecaptchaScore.toFixed(1)})</span>
                      : r.RecaptchaScore >= 0.3
                        ? <span className="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">보통 ({r.RecaptchaScore.toFixed(1)})</span>
                        : <span className="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700">의심 ({r.RecaptchaScore.toFixed(1)})</span>}
                </td>
                <td className="pl-3 pr-6 py-2.5 text-right whitespace-nowrap" onClick={(e) => e.stopPropagation()}>
                  {["검증필요", "GPS거부"].includes(r.VerifyStatus) && (
                    <button onClick={() => approve(r)} className="text-xs px-2 py-1 rounded-lg text-white mr-1.5" style={{ background: BRAND.accent }}>승인 처리</button>
                  )}
                  {unblockRowIds.has(r.id) && (
                    <button onClick={() => unblockDevice(r)} title="이 기기가 1분 내 5회 초과 접근으로 30분 차단된 상태라면, 기다리지 않고 지금 바로 차단을 풀어줍니다." className="text-xs px-2 py-1 rounded-lg border border-slate-300 text-slate-500 hover:bg-slate-50">차단해제</button>
                  )}
                </td>
              </tr>
            ))}
            {!rows.length && <tr><td colSpan={10} className="text-center text-slate-400 py-8">체크인 기록이 없습니다</td></tr>}
          </tbody>
        </table>
      </div>

      {rows.length > 0 && (
        <div className="flex items-center justify-between mt-3 text-sm">
          <div className="text-slate-400 text-xs">
            총 {rows.length}건 중 {(pageSafe - 1) * PAGE_SIZE + 1}–{Math.min(pageSafe * PAGE_SIZE, rows.length)}건 표시
          </div>
          <div className="flex items-center gap-1">
            <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={pageSafe <= 1}
              className="px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50">이전</button>
            <span className="px-2 text-slate-500 text-xs">{pageSafe} / {totalPages}</span>
            <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={pageSafe >= totalPages}
              className="px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50">다음</button>
          </div>
        </div>
      )}

      {detail && <CheckInDetailModal row={detail} onClose={() => setDetail(null)} />}
    </div>
  );
}

function DetailRow({ label, value }) {
  return (
    <div className="flex py-2 border-b border-slate-100 last:border-0">
      <div className="w-32 shrink-0 text-xs text-slate-400">{label}</div>
      <div className="text-sm text-slate-700 break-all">{value ?? "-"}</div>
    </div>
  );
}

function CheckInDetailModal({ row, onClose }) {
  return (
    <Modal title="체크인 상세 정보" onClose={onClose} wide>
      <div className="flex items-center gap-2 mb-3">
        <Badge status={row.VerifyStatus} />
        <span className="font-medium text-slate-800">{row.CenterName}</span>
      </div>
      <DetailRow label="시각 (KST)" value={fmtDate(row.ServerTimestamp)} />
      <DetailRow label="기기 클라이언트 시각" value={row.ClientTimestamp} />
      <DetailRow label="공인 IP" value={row.PublicIP} />
      <DetailRow label="IP 위치(도시)" value={row.IpCity} />
      <DetailRow label="IP 좌표" value={row.IpLat != null ? `${row.IpLat}, ${row.IpLng}` : "-"} />
      <DetailRow label="GPS 좌표" value={row.GpsLat != null ? `${row.GpsLat}, ${row.GpsLng}` : "동의 안 함"} />
      <DetailRow label="GPS 정확도" value={row.GpsAccuracy ? `±${Math.round(row.GpsAccuracy)}m` : "-"} />
      <DetailRow label="거리 / 기준" value={row.DistanceKm != null ? `${Number(row.DistanceKm).toFixed(2)}km (${row.DistanceSource})` : "-"} />
      <DetailRow label="기기" value={parseDeviceLabel(row.UserAgent)} />
      <DetailRow label="User-Agent 전체" value={row.UserAgent} />
      <DetailRow label="인증코드 (전체)" value={row.DeviceFingerprint} />
      <DetailRow label="기기 로컬 ID" value={row.DeviceId} />
      <DetailRow label="reCAPTCHA 점수" value={row.RecaptchaScore != null ? row.RecaptchaScore : "미확인"} />
    </Modal>
  );
}

/* ------------------------------------------------------------------ */
/* Overview 탭                                                         */
/* ------------------------------------------------------------------ */
function OverviewTab({ centers, checkins, admins, setTab }) {
  const activeCenters = centers.filter((c) => c.Active !== false).length;
  const needsVerify = checkins.filter((r) => r.VerifyStatus === "검증필요").length;
  const last30 = checkins.filter((r) => {
    const t = r.ServerTimestamp ? new Date(r.ServerTimestamp).getTime() : 0;
    return t >= Date.now() - 30 * 24 * 3600 * 1000;
  }).length;
  const recent = [...checkins].sort((a, b) => new Date(b.ServerTimestamp || 0) - new Date(a.ServerTimestamp || 0)).slice(0, 5);

  const stats = [
    { label: "활성 센터", value: activeCenters, suffix: ` / ${centers.length}`, icon: Building2, color: "text-emerald-600", bg: "bg-emerald-50", tab: "centers" },
    { label: "최근 30일 체크인", value: last30, icon: QrCode, color: "text-blue-600", bg: "bg-blue-50", tab: "checkins" },
    { label: "검증필요 (확인 대기)", value: needsVerify, icon: AlertTriangle, color: "text-amber-600", bg: "bg-amber-50", tab: "checkins" },
    { label: "등록된 관리자", value: admins.filter((a) => a.Active !== false).length, icon: ShieldCheck, color: "text-indigo-600", bg: "bg-indigo-50", tab: "admins" },
  ];

  return (
    <div>
      <div className="rounded-2xl p-6 mb-5 text-white relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${BRAND.navy}, #1A3A5C)` }}>
        <div className="relative z-10">
          <div className="flex items-center gap-2 mb-2">
            <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center"><QrCode size={16} /></div>
            <h3 className="font-semibold">MKQR이란?</h3>
          </div>
          <p className="text-sm text-white/70 leading-relaxed max-w-3xl">
            센터/업체별 QR 코드를 발급해서, 방문자가 로그인 없이 QR만 스캔하면 자동으로 시각·위치(GPS/IP)·기기 정보를 기록하고
            센터 반경 안인지 자동 검증하는 캠페인 방문 인증 시스템입니다. 어뷰징 방지를 위한 기기 핑거프린트, reCAPTCHA,
            짧은 시간 반복 접근 자동 차단 기능이 포함되어 있습니다.
          </p>
        </div>
        <div className="absolute -right-6 -bottom-10 w-40 h-40 rounded-full bg-white/5" />
        <div className="absolute right-16 -top-10 w-24 h-24 rounded-full bg-white/5" />
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        {stats.map((s) => (
          <div key={s.label} onClick={() => setTab(s.tab)}
            className="bg-white rounded-xl border p-4 cursor-pointer hover:border-slate-300 hover:shadow-sm transition-all flex items-center gap-3">
            <div className={`w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${s.bg}`}>
              <s.icon size={18} className={s.color} />
            </div>
            <div>
              <div className="text-xl font-semibold text-slate-800">{s.value}{s.suffix && <span className="text-sm font-normal text-slate-400">{s.suffix}</span>}</div>
              <div className="text-xs text-slate-400">{s.label}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 bg-white rounded-xl border overflow-hidden">
          <div className="px-4 py-3 border-b flex items-center justify-between">
            <span className="text-sm font-medium text-slate-700">최근 체크인</span>
            <button onClick={() => setTab("checkins")} className="text-xs text-slate-400 hover:text-slate-700">전체 보기 →</button>
          </div>
          {recent.length ? (
            <div>
              {recent.map((r) => (
                <div key={r.id} className="px-4 py-2.5 border-b last:border-0 flex items-center justify-between hover:bg-slate-50">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <Badge status={r.VerifyStatus} />
                    <span className="text-sm text-slate-700 truncate">{r.CenterName}</span>
                  </div>
                  <span className="text-xs text-slate-400 shrink-0 ml-2">{fmtDate(r.ServerTimestamp)}</span>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-center text-slate-400 text-sm py-10">아직 체크인 기록이 없습니다</div>
          )}
        </div>

        <div className="flex flex-col gap-3">
          <button onClick={() => setTab("centers")} className="bg-white rounded-xl border p-4 text-left hover:shadow-md hover:border-slate-300 transition-all flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ background: BRAND.accentSoft }}><Building2 size={16} style={{ color: BRAND.accent }} /></div>
            <div>
              <div className="font-medium text-sm text-slate-800">센터 관리</div>
              <div className="text-xs text-slate-400">업체 등록·수정, GPS 반경 설정</div>
            </div>
          </button>
          <button onClick={() => setTab("qr")} className="bg-white rounded-xl border p-4 text-left hover:shadow-md hover:border-slate-300 transition-all flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ background: BRAND.accentSoft }}><QrCode size={16} style={{ color: BRAND.accent }} /></div>
            <div>
              <div className="font-medium text-sm text-slate-800">QR 코드</div>
              <div className="text-xs text-slate-400">센터별 QR 생성/다운로드</div>
            </div>
          </button>
          <button onClick={() => setTab("checkins")} className="bg-white rounded-xl border p-4 text-left hover:shadow-md hover:border-slate-300 transition-all flex items-center gap-3">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ background: BRAND.accentSoft }}><ListChecks size={16} style={{ color: BRAND.accent }} /></div>
            <div>
              <div className="font-medium text-sm text-slate-800">체크인 기록</div>
              <div className="text-xs text-slate-400">방문 기록 조회 및 검증 처리</div>
            </div>

  );

/* ------------------------------------------------------------------ */
/* 카테고리 접근 권한 탭 — 관리자별로 화면(탭) 단위 접근을 체크박스로 관리      */
/* ------------------------------------------------------------------ */
function CategoryAccessTab({ admins, categoryAccess, reload }) {
  const [q, setQ] = useState("");
  const [directory, setDirectory] = useState([]);
  const [dirLoading, setDirLoading] = useState(true); // 직원 명부 로딩 끝나기 전엔 표를 그리지 않음(잘못된 중간 상태 깜빡임 방지)
  const [dirError, setDirError] = useState(false);
  const [saving, setSaving] = useState(false);
  const [savedPopup, setSavedPopup] = useState(null); // 저장 완료 후 안내 팝업에 띄울 건수
  // overrides: 아직 서버에 반영 안 된, 화면에서만 체크/해제한 임시 변경사항. { email: { catKey: bool, ... } }
  const [overrides, setOverrides] = useState({});

  useEffect(() => {
    loadEmployeeDirectory()
      .then((list) => setDirectory(list))
      .catch((e) => { console.warn("[MKQR] 직원 디렉토리 로딩 실패:", e.message); setDirError(true); })
      .finally(() => setDirLoading(false));
  }, []);

  // 표에 띄울 전체 인원: 전사 직원 디렉토리 + (디렉토리엔 없지만 이미 권한 기록이 있는 이메일도 누락 없이 포함)
  const dirEmails = new Set(directory.map((d) => d.email));
  const extraEmails = new Set(categoryAccess.map((r) => (r.Email || "").toLowerCase()));
  const merged = [...directory];
  extraEmails.forEach((email) => {
    if (email && !dirEmails.has(email)) {
      const row = categoryAccess.find((r) => (r.Email || "").toLowerCase() === email);
      merged.push({ name: (row && row.Title) || email, email, dept: "" });
    }
  });

  const qq = q.trim().toLowerCase();
  const filtered = qq
    ? merged.filter((p) => p.name.toLowerCase().includes(qq) || p.email.includes(qq) || (p.dept || "").toLowerCase().includes(qq))
    : merged;

  const [page, setPage] = useState(1);
  const PAGE_SIZE = 10;
  useEffect(() => { setPage(1); }, [q]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const pageSafe = Math.min(page, totalPages);
  const pageRows = filtered.slice((pageSafe - 1) * PAGE_SIZE, pageSafe * PAGE_SIZE);

  function rowFor(email) {
    return categoryAccess.find((r) => (r.Email || "").toLowerCase() === email);
  }
  // 서버에 실제 저장된 값 기준 (임시 변경 반영 전). 기록이 아예 없으면 기본은 전부 미허용(false).
  function savedChecked(person, cat) {
    const row = rowFor(person.email);
    return row ? row[cat.field] === true : false;
  }
  // 화면에 보여줄 값 — 아직 반영 안 한 로컬 변경이 있으면 그걸 우선 사용
  function effectiveChecked(person, cat) {
    const o = overrides[person.email];
    if (o && cat.key in o) return o[cat.key];
    return savedChecked(person, cat);
  }

  const dirtyCount = Object.keys(overrides).length;

  // 체크박스 클릭 — 서버 호출 없이 화면(로컬 상태)만 즉시 바꾼다. "관리자 전용"을 켜면 나머지 4개도 같이 켠다.
  function toggleLocal(person, cat) {
    const newVal = !effectiveChecked(person, cat);
    setOverrides((prev) => {
      const next = { ...prev };
      const catOverrides = { ...(next[person.email] || {}) };
      if (cat.key === "admins" && newVal === true) {
        MK_CATEGORIES.forEach((c) => { catOverrides[c.key] = true; });
      } else {
        catOverrides[cat.key] = newVal;
      }
      next[person.email] = catOverrides;
      return next;
    });
  }

  const allCheckedForCat = (cat) => filtered.length > 0 && filtered.every((p) => effectiveChecked(p, cat));
  function toggleAllForCatLocal(cat) {
    const target = !allCheckedForCat(cat);
    setOverrides((prev) => {
      const next = { ...prev };
      filtered.forEach((p) => {
        const catOverrides = { ...(next[p.email] || {}) };
        if (cat.key === "admins" && target === true) {
          MK_CATEGORIES.forEach((c) => { catOverrides[c.key] = true; });
        } else {
          catOverrides[cat.key] = target;
        }
        next[p.email] = catOverrides;
      });
      return next;
    });
  }

  // "반영" 버튼 — 지금까지 로컬에서 체크/해제한 것들을 한 번에 서버에 저장하고, 끝나면 목록을 딱 한 번만 새로고침한다.
  async function applyChanges() {
    const emails = Object.keys(overrides);
    if (!emails.length) return;
    setSaving(true);
    try {
      // 화면에 있는(부모 state) categoryAccess는 마지막 새로고침 시점 기준이라 약간 오래됐을 수 있다.
      // "이 사람 행이 이미 있나?"를 잘못 판단해서 중복 생성하는 사고를 막기 위해, 저장 직전 서버에서 최신 값을 다시 받아온다.
      const freshCategoryAccess = await mkListAll(MK_LISTS.categoryAccess);
      const freshRows = freshCategoryAccess.map((x) => ({ id: x.id, ...x.fields }));
      const freshRowFor = (email) => freshRows.find((r) => (r.Email || "").toLowerCase() === email);

      for (const email of emails) {
        const person = filtered.find((p) => p.email === email) || merged.find((p) => p.email === email);
        if (!person) continue;
        const changes = overrides[email];
        const existing = freshRowFor(email);
        const fields = existing ? {} : { Title: person.name || email, Email: email };
        if (!existing) MK_CATEGORIES.forEach((c) => { fields[c.field] = c.key in changes ? changes[c.key] : false; });
        else Object.keys(changes).forEach((catKey) => {
          const cat = MK_CATEGORIES.find((c) => c.key === catKey);
          fields[cat.field] = changes[catKey];
        });
        if (existing) await mkUpdateItem(MK_LISTS.categoryAccess, existing.id, fields);
        else await mkCreateItem(MK_LISTS.categoryAccess, fields);
      }
      setOverrides({});
      await reload();
      setSavedPopup(emails.length);
    } catch (e) { alert(e.message); } finally { setSaving(false); }
  }

  function discardChanges() { setOverrides({}); }

  // 상단 "현재 관리자 목록" 패널에서 × 누르면 즉시 그 사람의 관리자 전용(Access_admins) 권한만 끈다.
  // (다른 카테고리 권한은 그대로 유지 — 완전히 접근을 없애려면 표에서 전체 체크 해제 후 반영)
  async function quickRevoke(a) {
    if (admins.length <= 1) {
      if (!confirm(`마지막 남은 관리자입니다. "${a.Title || a.Email}"을 해제하면 관리자가 0명이 됩니다. 계속할까요?`)) return;
    } else if (!confirm(`"${a.Title || a.Email}"을 관리자에서 제외할까요? (다른 화면 권한은 유지됩니다)`)) return;
    try {
      const row = categoryAccess.find((r) => r.id === a.id);
      if (row) await mkUpdateItem(MK_LISTS.categoryAccess, row.id, { Access_admins: false });
      await reload();
    } catch (e) { alert(e.message); }
  }

  return (
    <div className="max-w-5xl mx-auto">
      <div className="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-5 flex gap-3">
        <KeyRound size={18} className="text-blue-500 shrink-0 mt-0.5" />
        <div className="text-sm text-blue-900">
          <div className="font-medium mb-1.5">화면 접근 권한 부여 방법</div>
          <ul className="space-y-1 text-blue-800/90 text-[13px] list-disc list-inside">
            <li>체크박스는 화면에서만 바뀌고, <b>"반영" 버튼을 눌러야 실제로 저장</b>됩니다</li>
            <li>체크된 채로 반영하면 아직 로그인이 안 되던 사람도 자동으로 로그인이 가능해집니다</li>
            <li>반대로 <b>어떤 화면도 체크 안 된 채로 반영하면 그 사람의 로그인 자체가 막힙니다</b></li>
            <li><b>"카테고리 접근 권한"</b>을 체크하면 나머지 4개 화면도 전부 같이 켜집니다 (=전체 관리자)</li>
            <li>각 열 맨 위 체크박스로 전체 선택/해제도 가능합니다</li>
          </ul>
        </div>
      </div>

      <div className="bg-white rounded-xl border p-4 mb-5">
        <div className="text-sm font-medium text-slate-700 mb-3">현재 관리자 목록 ({admins.length}명) — "카테고리 접근 권한"까지 체크된 전체 권한자만 표시</div>
        {admins.length ? (
          <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto">
            {admins.map((a) => (
              <span key={a.id} className="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 rounded-full bg-slate-100 text-xs text-slate-700">
                {a.Title || a.Email}
                <button onClick={() => quickRevoke(a)} title="관리자에서 제외" className="w-4 h-4 rounded-full hover:bg-slate-300 flex items-center justify-center text-slate-500">
                  <X size={10} />
                </button>
              </span>
            ))}
          </div>
        ) : (
          <p className="text-xs text-slate-400">전체 권한을 가진 관리자가 없습니다 — 아래 표에서 "카테고리 접근 권한"까지 체크하고 "반영"을 누르면 여기 표시됩니다</p>
        )}
      </div>

      <div className="flex items-center justify-between mb-4 gap-2 flex-wrap">
        <div className="flex items-center gap-2">
          <div className="relative max-w-xs flex-1 min-w-[220px]">
            <Search size={15} className="absolute left-2.5 top-2.5 text-slate-400" />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름/이메일/부서 검색" className="pl-8 pr-3 py-2 border border-slate-300 rounded-lg text-sm w-full" />
          </div>
          <span className="text-xs text-slate-400 whitespace-nowrap">총 {filtered.length}명</span>
        </div>
        <div className="flex items-center gap-2">
          {dirtyCount > 0 && <span className="text-xs text-amber-600">변경사항 {dirtyCount}건</span>}
          {dirtyCount > 0 && (
            <button onClick={discardChanges} disabled={saving} className="text-xs px-3 py-2 rounded-lg border border-slate-300 text-slate-500 hover:bg-slate-50">취소</button>
          )}
          <button onClick={applyChanges} disabled={saving || !dirtyCount}
            className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm text-white disabled:opacity-40" style={{ background: BRAND.accent }}>
            {saving ? "반영 중..." : "반영"}
          </button>
        </div>
      </div>
      {dirError && <p className="text-xs text-amber-600 mb-3">전 직원 명부를 불러오지 못해, 이미 등록된 관리자만 표시됩니다.</p>}

      {dirLoading ? (
        <div className="bg-white rounded-xl border py-16 text-center text-slate-400 text-sm">직원 명부를 불러오는 중입니다...</div>
      ) : (
        <>
          <div className="bg-white rounded-xl border overflow-hidden">
            <table className="w-full text-sm table-fixed">
                <colgroup>
                  <col style={{ width: "30%" }} />
                  {MK_CATEGORIES.map((c) => <col key={c.key} style={{ width: "14%" }} />)}
                </colgroup>
                <thead className="bg-slate-50 text-slate-500 text-xs">
                  <tr>
                    <th className="text-left px-4 py-3">사용자</th>
                    {MK_CATEGORIES.map((c) => (
                      <th key={c.key} className="text-center px-3 py-3 whitespace-nowrap">
                        <div className="flex flex-col items-center gap-1.5">
                          <input type="checkbox" checked={allCheckedForCat(c)}
                            onChange={() => toggleAllForCatLocal(c)} className="w-4 h-4 cursor-pointer" title="전체 선택/해제" />
                          <span>{c.label}</span>
                        </div>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {pageRows.map((p) => {
                    const adminCat = MK_CATEGORIES.find((c) => c.key === "admins");
                    const hasFullAdminAccess = effectiveChecked(p, adminCat);
                    const hasAnyAccess = MK_CATEGORIES.some((c) => effectiveChecked(p, c));
                    const rowDirty = !!overrides[p.email];
                    return (
                      <tr key={p.email} className={`border-t hover:bg-slate-50 ${rowDirty ? "bg-amber-50/50" : ""}`}>
                        <td className="px-4 py-3">
                          <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-semibold shrink-0" style={{ background: hasAnyAccess ? BRAND.navy : "#CBD5E1" }}>
                              {p.name.charAt(0).toUpperCase()}
                            </div>
                            <div className="min-w-0">
                              <div className="font-medium text-slate-800 truncate text-sm flex items-center gap-1.5">
                                {p.name}
                                {hasFullAdminAccess
                                  ? <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-normal">관리자</span>
                                  : hasAnyAccess && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-500 font-normal">로그인 가능</span>}
                              </div>
                              <div className="text-xs text-slate-400 truncate">{p.email}{p.dept ? ` · ${p.dept}` : ""}</div>
                            </div>
                          </div>
                        </td>
                        {MK_CATEGORIES.map((c) => (
                          <td key={c.key} className="text-center px-3 py-3">
                            <input type="checkbox" checked={effectiveChecked(p, c)}
                              onChange={() => toggleLocal(p, c)} className="w-4 h-4 cursor-pointer" />
                          </td>
                        ))}
                      </tr>
                    );
                  })}
                  {!filtered.length && (
                    <tr><td colSpan={MK_CATEGORIES.length + 1} className="text-center text-slate-400 py-10">검색 결과가 없습니다</td></tr>
                  )}
                </tbody>
            </table>
          </div>

          {filtered.length > 0 && (
            <div className="flex items-center justify-between mt-3 text-sm">
              <div className="text-slate-400 text-xs">
                총 {filtered.length}명 중 {(pageSafe - 1) * PAGE_SIZE + 1}–{Math.min(pageSafe * PAGE_SIZE, filtered.length)}명 표시
              </div>
              <div className="flex items-center gap-1">
                <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={pageSafe <= 1}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50">이전</button>
                <span className="px-2 text-slate-500 text-xs">{pageSafe} / {totalPages}</span>
                <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={pageSafe >= totalPages}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50">다음</button>
              </div>
            </div>
          )}
        </>
      )}

      {saving && <BlockingOverlay message="변경사항을 반영하고 있습니다..." />}

      {savedPopup != null && (
        <Modal title="반영 완료" onClose={() => setSavedPopup(null)}>
          <div className="text-center py-4">
            <CheckCircle2 size={32} className="mx-auto text-emerald-500 mb-3" />
            <div className="text-sm text-slate-600">{savedPopup}명의 접근 권한 변경사항이 저장되었습니다.</div>
          </div>
          <div className="flex justify-end">
            <button onClick={() => setSavedPopup(null)} className="px-4 py-2 text-sm rounded-lg text-white" style={{ background: BRAND.accent }}>확인</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function App({ userEmail }) {
  const [tab, setTab] = useState("overview");
  const [centers, setCenters] = useState([]);
  const [checkins, setCheckins] = useState([]);
  const [categoryAccess, setCategoryAccess] = useState([]);
  // "관리자"는 더 이상 별도 목록(mkqr_Admins)이 아니라, 카테고리 접근 권한에서 "카테고리 접근 권한(Access_admins)"이
  // 체크된 사람을 그때그때 계산한 값 — 진짜 전체 화면 접근 가능한 사람만 여기 들어간다.
  const admins = categoryAccess.filter((r) => r.Access_admins === true).map((r) => ({ id: r.id, Title: r.Title, Email: r.Email, Active: true }));
  const [checkinPeriodDays, setCheckinPeriodDays] = useState(30); // 체크인 기록은 목록이 커질 수 있어 기본 최근 30일만 조회
  const [loading, setLoading] = useState(true);
  const [hasLoadedOnce, setHasLoadedOnce] = useState(false); // 최초 로딩에만 전체화면 로딩 표시 — 그 이후 새로고침은 화면을 안 갈아엎음
  const [highlightId, setHighlightId] = useState(null);
  const [permDeniedPopup, setPermDeniedPopup] = useState(false); // 권한 없는 카테고리 클릭 시 안내 팝업

  async function reload(periodDays = checkinPeriodDays) {
    setLoading(true);
    try {
      // 체크인 기록은 커질수록 무거워지므로 ServerTimestamp 기준 최근 기간만 서버에서 걸러서 가져온다.
      // "전체"(periodDays=0)를 고르면 필터 없이 전부 가져온다 — 데이터가 많으면 느릴 수 있음.
      let checkinQuery = "";
      if (periodDays > 0) {
        const since = new Date(Date.now() - periodDays * 24 * 3600 * 1000).toISOString();
        checkinQuery = `&$filter=fields/ServerTimestamp ge '${since}'`;
      }
      const [c, k, ca] = await Promise.all([
        mkListAll(MK_LISTS.centers),
        mkListAll(MK_LISTS.checkins, checkinQuery),
        mkListAll(MK_LISTS.categoryAccess).catch(() => []),
      ]);
      setCenters(c.map((x) => ({ id: x.id, ...x.fields })));
      setCheckins(k.map((x) => ({ id: x.id, ...x.fields })));
      setCategoryAccess(ca.map((x) => ({ id: x.id, ...x.fields })));
    } catch (e) { console.error(e); alert("데이터 로딩 실패: " + e.message); }
    setLoading(false);
    setHasLoadedOnce(true);
  }
  useEffect(() => { reload(); }, []);

  function changeCheckinPeriod(days) {
    setCheckinPeriodDays(days);
    reload(days);
  }

  const needsVerify = checkins.filter((r) => r.VerifyStatus === "검증필요").length;

  function handleCenterCreated(id) {
    setHighlightId(id);
    setTab("qr");
    setTimeout(() => setHighlightId(null), 5000);
  }

  // 로그인한 사용자의 카테고리별 접근 권한 — 본인 행이 없거나 특정 컬럼이 비어있으면 "허용"으로 간주.
  const myAccessRow = categoryAccess.find((r) => (r.Email || "").toLowerCase() === (userEmail || "").toLowerCase());
  function canAccess(catKey) {
    if (!myAccessRow) return true;
    const cat = MK_CATEGORIES.find((c) => c.key === catKey);
    const val = myAccessRow[cat.field];
    return val !== false;
  }

  const allNav = [
    { id: "overview", label: "Overview", icon: LayoutDashboard, cat: "overview" },
  ];
  const adminNav = [
    { id: "centers", label: "센터 관리", icon: Building2, cat: "centers" },
    { id: "qr", label: "QR 코드", icon: QrCode, cat: "qr" },
    { id: "checkins", label: "체크인 기록", icon: ListChecks, badge: needsVerify, cat: "checkins" },
    { id: "categoryAccess", label: "카테고리 접근 권한", icon: KeyRound, cat: "admins" },
  ];
  const nav = [...allNav, ...adminNav]; // 항상 전체 표시 — 권한 없는 항목은 숨기지 않고 흐릿하게 비활성화만 함
  const accessibleNav = nav.filter((n) => canAccess(n.cat));

  useEffect(() => {
    if (!loading && accessibleNav.length && !accessibleNav.some((n) => n.id === tab)) setTab(accessibleNav[0].id);
  }, [loading, myAccessRow]);

  // 로그인은 되지만(=mkqr_Admins엔 있음) 카테고리 접근 권한이 하나도 없는 사람은, 이도저도 아닌 텅 빈 화면을
  // 보여주는 대신 로그인 자체가 안 되는 사람과 똑같이 "접근 권한 없음" 전체 화면으로 통일해서 보여준다.
  if (hasLoadedOnce && accessibleNav.length === 0) {
    return <AccessDenied userEmail={userEmail} adminEmails={admins.filter((a) => a.Active !== false).map((a) => a.Email)} />;
  }

  return (
    <div className="h-screen flex overflow-hidden" style={{ background: "#F5F6F8" }}>
      <aside className="w-56 shrink-0 text-white flex flex-col" style={{ background: BRAND.navy }}>
        <div className="px-4 pt-5 pb-4 border-b border-white/10">
          <div className="bg-white rounded-lg px-3 py-2 flex items-center justify-center">
            <img src={LOGO_SRC} alt="Star Truck Korea" style={{ width: "100%", height: "auto", display: "block" }} />
          </div>
          <p className="text-slate-400 text-[10px] text-center mt-1.5">MKQR · 방문인증 QR</p>
        </div>
        <nav className="flex-1 py-3 overflow-y-auto">
          {allNav.map((n) => {
            const allowed = canAccess(n.cat);
            return (
              <button key={n.id} onClick={() => allowed ? setTab(n.id) : setPermDeniedPopup(true)}
                className={`w-full flex items-center gap-2.5 px-5 py-2.5 text-sm ${
                  !allowed ? "text-white/20 hover:text-white/40" : tab === n.id ? "bg-white/10 text-white" : "text-white/60 hover:text-white/90"
                }`}>
                <n.icon size={16} /> {n.label}
                {!!n.badge && allowed && <span className="ml-auto bg-amber-400 text-amber-900 text-[10px] font-bold px-1.5 py-0.5 rounded-full">{n.badge}</span>}
              </button>
            );
          })}
          <div className="px-5 pt-4 pb-1.5 text-[10px] font-semibold text-white/30 tracking-wide">관리자 전용</div>
          {adminNav.map((n) => {
            const allowed = canAccess(n.cat);
            return (
              <button key={n.id} onClick={() => allowed ? setTab(n.id) : setPermDeniedPopup(true)}
                className={`w-full flex items-center gap-2.5 px-5 py-2.5 text-sm ${
                  !allowed ? "text-white/20 hover:text-white/40" : tab === n.id ? "bg-white/10 text-white" : "text-white/60 hover:text-white/90"
                }`}>
                <n.icon size={16} /> {n.label}
                {!!n.badge && allowed && <span className="ml-auto bg-amber-400 text-amber-900 text-[10px] font-bold px-1.5 py-0.5 rounded-full">{n.badge}</span>}
              </button>
            );
          })}
        </nav>
        <div className="px-5 py-3 border-t border-white/10 text-[10px] text-white/30">MKQR</div>
      </aside>
      <main className="flex-1 p-6 overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg font-semibold text-slate-800">{nav.find((n) => n.id === tab)?.label}</h2>
          <div className="flex items-center gap-2">
            <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-full pl-1.5 pr-3 py-1">
              <div className="w-6 h-6 rounded-full flex items-center justify-center text-white text-[11px] font-semibold shrink-0" style={{ background: BRAND.navy }}>
                {(userEmail || "?").charAt(0).toUpperCase()}
              </div>
              <span className="text-xs text-slate-600 max-w-[160px] truncate">{userEmail}</span>
            </div>
            <a href="https://aps.startruckkorea.com/" target="_blank" rel="noreferrer"
              className="flex items-center gap-1.5 text-xs text-slate-600 bg-white border border-slate-200 rounded-full px-3 py-1.5 hover:bg-slate-50">
              <ArrowUpRight size={13} /> APS로 돌아가기
            </a>
            <button onClick={() => msalApp.logoutRedirect()}
              className="flex items-center gap-1.5 text-xs text-slate-600 bg-white border border-slate-200 rounded-full px-3 py-1.5 hover:bg-slate-50">
              <LogOut size={13} /> 로그아웃
            </button>
          </div>
        </div>
        {!hasLoadedOnce ? <div className="text-slate-400 text-sm">불러오는 중...</div> : !canAccess(nav.find((n) => n.id === tab)?.cat) ? (
          <div className="bg-white rounded-xl border p-10 text-center">
            <ShieldCheck size={28} className="mx-auto text-slate-300 mb-2" />
            <div className="text-slate-500 text-sm">이 화면에 대한 접근 권한이 없습니다.</div>
          </div>
        ) : (
          <>
            {tab === "overview" && <OverviewTab centers={centers} checkins={checkins} admins={admins} setTab={setTab} />}
            {tab === "centers" && <CentersTab centers={centers} reload={reload} onCreated={handleCenterCreated} />}
            {tab === "qr" && <QrTab centers={centers} highlightId={highlightId} />}
            {tab === "checkins" && <CheckInsTab checkins={checkins} centers={centers} reload={reload} periodDays={checkinPeriodDays} onPeriodChange={changeCheckinPeriod} />}
            {tab === "categoryAccess" && <CategoryAccessTab admins={admins} categoryAccess={categoryAccess} reload={reload} />}
          </>
        )}
        <div className="text-center mt-10 pt-5 border-t border-slate-200 text-[11px] text-slate-400 leading-relaxed">
          <div>© 2026 Star Truck Korea · MKQR</div>
          <div>This system is internally developed by Star Truck Korea IT Dept. Unauthorized access is strictly prohibited.</div>
        </div>
      </main>

      {permDeniedPopup && (
        <Modal title="접근 권한 없음" onClose={() => setPermDeniedPopup(false)}>
          <div className="text-center py-2">
            <ShieldCheck size={28} className="mx-auto text-slate-300 mb-3" />
            <p className="text-sm text-slate-600">이 카테고리에 접근 권한이 없습니다.<br />관리자에게 문의해주세요.</p>
          </div>
          <div className="flex justify-end mt-2">
            <button onClick={() => setPermDeniedPopup(false)} className="px-4 py-2 text-sm rounded-lg text-white" style={{ background: BRAND.accent }}>확인</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function AccessDenied({ userEmail, adminEmails }) {
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: "#F5F6F8" }}>
      <div className="bg-white rounded-xl border p-8 max-w-md w-full text-center">
        <AlertTriangle size={32} className="mx-auto text-amber-500 mb-3" />
        <h2 className="text-lg font-semibold text-slate-800 mb-1">접근 권한 없음</h2>
        <p className="text-sm text-slate-500 mb-4">MKQR 관리자 전용 화면입니다. 현재 계정({userEmail})은 등록된 관리자가 아닙니다.</p>
        {adminEmails.length > 0 && (
          <div className="bg-slate-50 rounded-lg p-4 text-left mb-4">
            <div className="text-xs font-medium text-slate-500 mb-2">아래 등록된 관리자에게 접근 권한을 요청해주세요</div>
            <div className="space-y-1">
              {adminEmails.map((email) => (
                <a key={email} href={`mailto:${email}?subject=${encodeURIComponent("MKQR 접근 권한 요청")}&body=${encodeURIComponent(`MKQR 관리자 화면 접근 권한을 요청드립니다.\n계정: ${userEmail}`)}`}
                  className="flex items-center gap-1.5 text-sm text-slate-700 hover:underline">
                  <Mail size={13} className="text-slate-400 shrink-0" /> {email}
                </a>
              ))}
            </div>
          </div>
        )}
        <a href="https://aps.startruckkorea.com/" className="inline-flex items-center gap-1.5 text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-full px-4 py-2 hover:bg-slate-100">
          <ArrowUpRight size={14} /> APS로 돌아가기
        </a>
      </div>
    </div>
  );
}

async function mkBoot(account) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("loading").style.display = "flex";
  try {
    const token = await getGraphToken();
    const siteRes = await apiGet(`/sites/${SITE_PATH}`, token);
    _siteId = siteRes.id;
  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    showLoginErr("SharePoint 연결 실패: " + e.message);
    return;
  }

  // mkqr_CategoryAccess 목록 기반 접근 제어 (mkqr_Admins는 더 이상 안 씀).
  // - 카테고리를 하나라도 체크받은 사람이 한 명도 없으면 "부트스트랩 상태"로 보고 전체 허용 — 아무도 등록 안 된
  //   상태에서 전부 막아버리면 첫 관리자조차 들어올 수 없기 때문. "카테고리 접근 권한"에서 본인을 체크하고
  //   반영하면 그때부터 제한 시작됨.
  // - 목록 조회 자체가 실패(네트워크 등)해도 fail-open — 일시적 오류로 전체가 잠기는 걸 방지.
  let isAdmin = true;
  let adminEmails = [];
  try {
    const items = await mkListAll(MK_LISTS.categoryAccess);
    const rows = items.map((x) => x.fields);
    const anyAccessRows = rows.filter((r) => MK_CATEGORIES.some((c) => r[c.field] === true));
    adminEmails = rows.filter((r) => r.Access_admins === true).map((r) => (r.Email || "").trim().toLowerCase()).filter(Boolean);
    if (anyAccessRows.length > 0) {
      isAdmin = anyAccessRows.some((r) => (r.Email || "").trim().toLowerCase() === (account.username || "").trim().toLowerCase());
    }
  } catch (e) {
    console.warn("[MKQR] mkqr_CategoryAccess 목록 조회 실패, 임시로 전체 허용:", e.message);
  }

  const loadingEl = document.getElementById("loading");
  if (loadingEl) loadingEl.remove();
  const rootEl = document.getElementById("root");
  if (!isAdmin) {
    createRoot(rootEl).render(<AccessDenied userEmail={account.username} adminEmails={adminEmails} />);
    return;
  }
  createRoot(rootEl).render(<App userEmail={account.username} />);
}

(async function initMsal() {
  const btn = document.getElementById("btn-login");
  try {
    await msalApp.initialize();
    const resp = await msalApp.handleRedirectPromise();
    if (resp && resp.account) { msalApp.setActiveAccount(resp.account); await mkBoot(resp.account); return; }
    const accounts = msalApp.getAllAccounts();
    if (accounts.length) { msalApp.setActiveAccount(accounts[0]); await mkBoot(accounts[0]); return; }
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Microsoft 365 계정으로 로그인"; }
    showLoginErr(e.message);
  }
})();

document.getElementById("btn-login").onclick = async () => {
  try {
    if (window !== window.top) { window.open(window.location.href, "_blank"); return; }
    await msalApp.loginRedirect({ scopes: MSAL_SCOPES });
  } catch (e) { showLoginErr(e.message); }
};
</script>
</body>
