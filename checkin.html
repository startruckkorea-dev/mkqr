<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>방문 체크인 · Star Truck Korea</title>
<!-- reCAPTCHA v3: 화면엔 아무것도 안 보이고 배경에서 점수만 매김. Jimmy님이 사이트 키 알려주시면 아래 YOUR_RECAPTCHA_SITE_KEY 교체 -->
<script src="https://www.google.com/recaptcha/api.js?render=6LfNeGwtAAAAAHN1aN-Je7ywl5zfi3BExCACNqEA"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(145deg,#0f2744 0%,#101B34 100%); min-height: 100vh; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { background: #fff; border-radius: 18px; padding: 36px 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center; }
  .logo { font-size: 2.2rem; margin-bottom: 10px; }
  h1 { font-size: 1.05rem; font-weight: 700; color: #101B34; margin: 0 0 4px; }
  .center-name { color: #2F7B7A; font-weight: 600; font-size: 1.15rem; margin-bottom: 4px; }
  .sub { color: #8A94A6; font-size: .82rem; margin-bottom: 20px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #E4F1F0; border-top-color: #2F7B7A; margin: 18px auto; animation: spin .85s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-text { color: #64748B; font-size: .85rem; margin-top: 8px; }
  .result-icon { font-size: 2.4rem; margin-bottom: 8px; }
  .result-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; color: #101B34; }
  .result-desc { color: #64748B; font-size: .85rem; line-height: 1.6; }
  .auth-code { margin-top: 16px; font-size: .72rem; color: #94a3b8; }
  .block-box { background: #FEF2F2; border-radius: 12px; padding: 16px; margin-top: 14px; }
  .block-box .result-desc { color: #B91C1C; }
  .foot { text-align: center; color: rgba(255,255,255,.5); font-size: 11px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="logo">📍</div>
    <h1>방문 체크인</h1>
    <div class="center-name" id="center-name">불러오는 중...</div>
    <div class="sub">Star Truck Korea · Campaign Visit Verification</div>
    <div id="state-area">
      <div class="spinner"></div>
      <div class="state-text" id="state-text">확인 중입니다...</div>
    </div>
    <div id="result" style="display:none"></div>
  </div>
</div>
<div class="foot">© 2026 Star Truck Korea</div>

<script>
// ⚠️ 배포 시 실제 Cloudflare Worker 주소로 교체
const API_BASE = "https://mkqr-worker.mkqr.workers.dev";
// ⚠️ Google reCAPTCHA 관리 콘솔에서 받은 사이트 키로 교체 (위 <script> 태그의 render= 값도 같이 교체해야 함)
const RECAPTCHA_SITE_KEY = "6LfNeGwtAAAAAHN1aN-Je7ywl5zfi3BExCACNqEA";

const params = new URLSearchParams(location.search);
const token = params.get("t");
const centerNameEl = document.getElementById("center-name");
const stateArea = document.getElementById("state-area");
const stateText = document.getElementById("state-text");
const resultEl = document.getElementById("result");

function setState(text) { stateText.textContent = text; }

function showFinal(html) {
  stateArea.style.display = "none";
  resultEl.style.display = "block";
  resultEl.innerHTML = html;
}

function getDeviceId() {
  let id = localStorage.getItem("mkqr_device_id");
  if (!id) {
    id = "dev_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("mkqr_device_id", id);
  }
  return id;
}

// 기기 핑거프린트 — localStorage(mkqr_device_id)는 브라우저 데이터를 지우면 바로 초기화되지만,
// 화면/캔버스/시간대 등 하드웨어·환경 신호를 조합한 이 값은 지워지지 않아 같은 기기의 반복 접근을
// 어느 정도 더 잡아낼 수 있다 (완벽하게 우회를 막지는 못함 — 어뷰징 난이도를 높이는 용도).
async function getDeviceFingerprint() {
  const parts = [
    navigator.userAgent,
    navigator.language,
    screen.width + "x" + screen.height + "x" + screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    navigator.hardwareConcurrency || "",
    navigator.deviceMemory || "",
  ];
  try {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px Arial";
    ctx.fillText("mkqr-fp-🔒", 2, 2);
    parts.push(canvas.toDataURL());
  } catch (e) { /* 캔버스 차단 브라우저는 무시 */ }
  const raw = parts.join("||");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function getGps() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  });
}

// reCAPTCHA v3 토큰 발급 — 화면엔 아무것도 안 뜨고 배경에서 처리됨.
// 광고차단기 등으로 스크립트 자체가 막혀도 체크인 흐름은 계속 진행되도록 실패시 null 반환.
function getRecaptchaToken() {
  return new Promise((resolve) => {
    if (typeof grecaptcha === "undefined" || RECAPTCHA_SITE_KEY === "YOUR_RECAPTCHA_SITE_KEY") { resolve(null); return; }
    try {
      grecaptcha.ready(() => {
        grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: "checkin" }).then(resolve).catch(() => resolve(null));
      });
    } catch (e) { resolve(null); }
  });
}

function renderSuccess(data, fingerprint) {
  const ok = data.verifyStatus === "정상";
  let desc;
  if (ok) desc = "방문 위치가 정상적으로 확인되었습니다.<br>감사합니다.";
  else if (data.gpsUsed) desc = "현재 위치가 센터 반경(10km)을 벗어나 있어<br>담당자 확인 후 처리됩니다.";
  else desc = "위치 정보 확인이 어려워<br>담당자 확인 후 처리됩니다.";

  const authCode = fingerprint ? fingerprint.slice(0, 8).toUpperCase() : "";
  showFinal(`
    <div class="result-icon">${ok ? "✅" : "⚠️"}</div>
    <div class="result-title">${ok ? "체크인 완료" : "체크인 접수 (확인 필요)"}</div>
    <div class="result-desc">${desc}</div>
    ${authCode ? `<div class="auth-code">인증코드 ${authCode}</div>` : ""}
  `);
}

function renderBlocked(message) {
  showFinal(`
    <div class="result-icon">🚫</div>
    <div class="result-title">접속이 제한되었습니다</div>
    <div class="block-box"><div class="result-desc">${message}</div></div>
  `);
}

function renderError(message) {
  showFinal(`
    <div class="result-icon">⚠️</div>
    <div class="result-title">처리할 수 없습니다</div>
    <div class="result-desc">${message}</div>
  `);
}

async function run() {
  if (!token) {
    centerNameEl.textContent = "잘못된 접근입니다";
    renderError("QR 코드를 다시 스캔해주세요.");
    return;
  }

  // 1) 센터 정보 조회
  let centerInfo;
  try {
    const res = await fetch(`${API_BASE}/api/center?t=${encodeURIComponent(token)}`);
    centerInfo = await res.json();
    if (!res.ok || !centerInfo.name) throw new Error(centerInfo.error || "센터 정보를 찾을 수 없습니다");
    centerNameEl.textContent = centerInfo.name;
  } catch (e) {
    centerNameEl.textContent = "센터 정보를 불러올 수 없습니다";
    renderError(e.message);
    return;
  }

  // 2) 위치/기기정보 수집 (사용자 입력 없이 자동 진행)
  setState("위치 정보를 확인하고 있습니다...");
  const gps = await getGps();
  const fingerprint = await getDeviceFingerprint().catch(() => "");
  const recaptchaToken = await getRecaptchaToken();
  setState("체크인 처리 중입니다...");

  const payload = {
    token,
    gps,
    clientTimestamp: new Date().toISOString(),
    deviceId: getDeviceId(),
    deviceFingerprint: fingerprint,
    userAgent: navigator.userAgent,
    recaptchaToken,
  };

  // 3) 자동 체크인 요청
  let data;
  try {
    const res = await fetch(`${API_BASE}/api/checkin`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    data = await res.json();
    if (!res.ok) {
      if (res.status === 429 && data.blocked) { renderBlocked(data.error); return; }
      throw new Error(data.error || "체크인에 실패했습니다");
    }
  } catch (e) {
    renderError(e.message);
    return;
  }

  // 4) 센터별 이동 링크가 설정돼 있으면 바로 이동, 없으면 완료 화면만 표시
  if (data.redirectUrl) {
    setState("이동 중입니다...");
    location.replace(data.redirectUrl);
    return;
  }
  renderSuccess(data, fingerprint);
}

run();
</script>
</body>
</html>
